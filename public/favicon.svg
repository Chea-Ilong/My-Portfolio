<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Chea Ilong">
  <title>Chea Ilong</title>
  <!-- Monochrome, and it inverts with the browser theme so the tile never sinks into
       a dark tab strip. Geometry is landed on the pixel grid: stroke 4 with edges on
       even coordinates means the stem and the tile edges stay crisp when the 32px
       artwork is halved to 16px. Terminals are butt caps, not round, which is what
       gives the mark its hard edge at small sizes. -->
  <style>
    .tile { fill: #0d0d0d; }
    .mark { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f5f5f5; }
      .mark { stroke: #0d0d0d; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="5" />
  <g class="mark" fill="none" stroke-width="4">
    <!-- C: 252deg arc, r=7 about (13, 16). Outer edge spans x 4 -> 19, y 7 -> 25.
         The aperture is cut wider than a text C would be so the counter still reads
         as an opening, not a hole, once the mark is down at 16px. -->
    <path d="M17.12 10.34A7 7 0 1 0 17.12 21.66" />
    <!-- I: stem on x 24 -> 28, top and bottom flush with the C's outer extent. -->
    <path d="M26 7v18" />
  </g>
</svg>
